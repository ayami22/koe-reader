name: koe_reader
description: A Japanese novel reader with real-time TTS, furigana annotation, and custom voice support.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # File handling
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  path: ^1.9.0

  # EPUB parsing
  epubx: ^4.0.0

  # HTTP client (TTS API)
  dio: ^5.7.0

  # Audio playback
  just_audio: ^0.9.42

  # Local storage
  shared_preferences: ^2.3.4

  # UI
  google_fonts: ^6.2.1

  # Utilities
  collection: ^1.19.0
  uuid: ^4.5.1
  intl: ^0.19.0
  wakelock_plus: ^1.2.8
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/books/
    - assets/dict/
